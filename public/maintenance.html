<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#171613"><title>FOON — Maintenance / صيانة / Maintenance</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at top,#393021,#171613 58%);color:#f8f3e9;font:16px/1.75 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}main{width:min(100%,620px);background:#24221e;border:1px solid #554733;border-radius:24px;padding:clamp(24px,6vw,50px);box-shadow:0 25px 60px #0006;text-align:center}.brand{font-size:32px;color:#e2a93b;font-weight:900;letter-spacing:.12em}.symbol{width:65px;height:65px;background:#e2a93b1b;color:#e2a93b;border-radius:19px;display:grid;place-items:center;font-size:30px;margin:20px auto}h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.4}p{color:#d5cdc2}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:26px 0 18px}.actions button,.actions a{display:inline-grid;place-items:center;min-height:44px;padding:10px 16px;border-radius:11px;font:inherit;font-weight:750;text-decoration:none;cursor:pointer}.retry{color:#171613;background:#e2a93b;border:1px solid #e2a93b}.home{color:#f8f3e9;background:transparent;border:1px solid #827054}.languages{display:flex;justify-content:center;gap:9px;margin-top:17px}.languages button{min-height:38px;min-width:50px;border-radius:8px;border:1px solid #827054;background:transparent;color:#f8f3e9;cursor:pointer}.languages button[aria-pressed=true]{color:#e2a93b;border-color:#e2a93b}.meta{border-top:1px solid #ffffff20;padding-top:16px;font-size:.85rem}code{color:#e2a93b;direction:ltr;unicode-bidi:isolate}button:focus-visible,a:focus-visible{outline:3px solid #e2a93b;outline-offset:3px}@media(max-width:430px){.actions{flex-direction:column}.actions>*{width:100%}}
</style></head><body><main><div class="brand">FOON</div><div class="symbol" aria-hidden="true">⚙</div><h1 id="title">نقوم بتحديث المنصة</h1><p id="description">نعمل على تحسين خدمات NFOOD. قد يتعذر الوصول إليها مؤقتًا.</p>
<div class="actions"><button class="retry" type="button" id="retry" onclick="location.reload()">التحقق مجددًا</button><a class="home" id="home" href="/">الرئيسية</a></div>
<div class="meta"><p id="status">رمز الحالة: 502 / 503 / 504</p><p id="reference">مرجع الصيانة: EDGE-MAINTENANCE</p><p id="help">إذا استمر الخطأ، أرسل رمز الحالة ووقت ظهوره لفريق الدعم.</p></div>
<nav class="languages" aria-label="Language / اللغة / Langue"><button type="button" data-lang="ar" aria-pressed="true">العربية</button><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="fr" aria-pressed="false">FR</button></nav></main>
<script>
(function(){
 const copy={
 ar:["نقوم بتحديث المنصة","نعمل على تحسين خدمات NFOOD. قد يتعذر الوصول إليها مؤقتًا.","التحقق مجددًا","الرئيسية","رمز الحالة: 502 / 503 / 504","مرجع الصيانة: EDGE-MAINTENANCE","إذا استمر الخطأ، أرسل رمز الحالة ووقت ظهوره لفريق الدعم."],
 en:["We're updating the platform","NFOOD services are being updated and may be temporarily unavailable.","Check again","Home","HTTP status: 502 / 503 / 504","Maintenance reference: EDGE-MAINTENANCE","If the error persists, share the HTTP status and time with support."],
 fr:["Nous mettons la plateforme à jour","Les services NFOOD sont en cours de mise à jour et peuvent être temporairement indisponibles.","Vérifier à nouveau","Accueil","Code HTTP : 502 / 503 / 504","Référence maintenance : EDGE-MAINTENANCE","Si l'erreur persiste, transmettez le code HTTP et l'heure à l'assistance."]
 };
 function selected(l){return l==="en"||l==="fr"?l:"ar";}
 function change(lang){lang=selected(lang);document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";["title","description","retry","home","status","reference","help"].forEach((id,i)=>document.getElementById(id).textContent=copy[lang][i]);document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));document.cookie="foon_language="+lang+"; Path=/; SameSite=Lax; Max-Age=31536000";}
 const prior=document.cookie.match(/(?:^|;\s*)foon_language=(ar|en|fr)(?:;|$)/);
 change(prior?prior[1]:selected((navigator.language||"").split("-")[0]));
 document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>change(b.dataset.lang)));
})();
</script></body></html>
