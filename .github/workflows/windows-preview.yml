name: Windows original-site preview
on:
  pull_request:
    branches: [main]
    paths: ['apps/windows/**', 'lib/platform/desktop-sync*', 'lib/platform/edge-*', 'lib/restaurant/operations.ts', 'app/restaurant/order-workspace.tsx', 'app/restaurant/desktop-sync-badge.tsx', 'migrations/**', 'instrumentation.ts', '.github/workflows/windows-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix apps/windows ci --no-audit --no-fund
      - run: npm --prefix apps/windows test
      - run: node --test scripts/desktop-sync.test.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm --prefix apps/windows run dist
      - uses: actions/upload-artifact@v4
        with:
          name: foon-windows-unsigned-preview
          path: apps/windows/dist/*Setup.exe
          if-no-files-found: error
