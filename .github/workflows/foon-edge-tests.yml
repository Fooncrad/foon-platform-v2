name: FOON Edge Storage Tests
on:
  push:
    branches: [main]
    paths:
      - "scripts/foon-lan-sqlite.mjs"
      - "scripts/foon-lan-sqlite.test.mjs"
      - "scripts/foon-edge-backup.mjs"
      - "scripts/foon-edge-backup.test.mjs"
      - "scripts/foon-edge-sync-contract.mjs"
      - "scripts/foon-edge-sync-contract.test.mjs"
      - "lib/platform/edge-sync-validation.mjs"
      - "lib/platform/edge-sync-accept.mjs"
      - "lib/platform/edge-sync-mysql-adapter.mjs"
      - "lib/platform/edge-sync-receipt-signature.mjs"
      - "lib/platform/edge-sync-service.mjs"
      - "scripts/foon-edge-service.test.mjs"
      - "scripts/foon-edge-receipt-signature.test.mjs"
      - "scripts/foon-edge-mysql-adapter.test.mjs"
      - "scripts/foon-edge-accept.test.mjs"
      - "scripts/foon-edge-central-validation.test.mjs"
      - ".github/workflows/foon-edge-tests.yml"
  workflow_dispatch:
jobs:
  edge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check scripts/foon-lan-sqlite.mjs
      - run: node --check scripts/foon-edge-backup.mjs
      - run: node --check scripts/foon-edge-sync-contract.mjs
      - run: node --check lib/platform/edge-sync-validation.mjs
      - run: node --check lib/platform/edge-sync-accept.mjs
      - run: node --check lib/platform/edge-sync-mysql-adapter.mjs
      - run: node --check lib/platform/edge-sync-receipt-signature.mjs
      - run: node --check lib/platform/edge-sync-service.mjs
      - run: node --test scripts/foon-lan-sqlite.test.mjs scripts/foon-edge-backup.test.mjs scripts/foon-edge-sync-contract.test.mjs scripts/foon-edge-central-validation.test.mjs
